name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # `npm stage publish` needs npm 12 or newer.
      - name: Use the latest npm
        run: npm install -g npm@latest
      - name: Verify
        run: |
          node --check index.js
          node --check client.js
          npm run check
      - name: Stage the package for publishing
        run: npm stage publish --provenance --access public
        env:
          # Granular token with "Read and write (stage only)" is enough: staging
          # never asks for 2FA, the maintainer approves the staged version.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
